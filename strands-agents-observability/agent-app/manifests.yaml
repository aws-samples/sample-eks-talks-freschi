apiVersion: v1
kind: Namespace
metadata:
  name: agent-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: agent-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "secrets", "configmaps", "namespaces"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-reader
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: agent-app
roleRef:
  kind: ClusterRole
  name: sre-agent-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: agent-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent
      containers:
        - name: agent
          image: ${ECR_REPO}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PROVIDER
              value: "${MODEL_PROVIDER}"
            - name: BEDROCK_MODEL
              value: "anthropic.claude-sonnet-4-6"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: VLLM_BASE_URL
              value: "http://vllm-svc.vllm:8000/v1"
            - name: VLLM_MODEL
              value: "meta-llama/Llama-3.1-8B-Instruct"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "sre-agent"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.observability:80"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent
  namespace: agent-app
spec:
  selector:
    app: sre-agent
  ports:
    - port: 8000
      targetPort: 8000
